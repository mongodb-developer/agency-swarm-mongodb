[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-swarm-mongodb"
version = "0.1.0"
description = "MongoDB Atlas-backed thread/session persistence for VRSEN Agency Swarm."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MongoDB Developer Relations" }]
keywords = ["agency-swarm", "mongodb", "atlas", "agent", "persistence", "threads", "session"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
    "python-dotenv>=1.0",
]
demo = [
    "agency-swarm>=1.0",
]

[project.urls]
Homepage = "https://github.com/mongodb-developer/agency-swarm-mongodb"
Repository = "https://github.com/mongodb-developer/agency-swarm-mongodb"
Upstream = "https://github.com/VRSEN/agency-swarm"

# Constrain the build to this directory's `src/` so editable installs don't walk
# parent directories (which fails outside this package's tree).
[tool.hatch.build.targets.wheel]
packages = ["src/agency_swarm_mongodb"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "demo", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
